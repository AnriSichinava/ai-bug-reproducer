<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agent Runs — AI Bug Reproducer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <nav class="topbar">
      <span class="mark" aria-hidden="true"></span>
      <a href="/dashboard.html">Dashboard</a>
      <button id="logout-btn" style="margin-left: auto;">Logout</button>
    </nav>

    <main>
      <h1>Agent runs</h1>
      <div class="panel">
        <ul id="run-list" class="rows"></ul>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
  <script>
    requireAuth();

    const bugId = new URLSearchParams(window.location.search).get('bugId');

    async function loadRuns() {
      const res = await api(`/api/agent-runs?bugId=${bugId}&pageSize=100`);
      const page = await res.json();
      const list = document.getElementById('run-list');
      list.innerHTML = '';
      for (const run of page.items) {
        const li = document.createElement('li');
        li.id = `run-${run.id}`;
        const link = document.createElement('a');
        link.href = `/run.html?id=${run.id}`;
        link.textContent = `Run #${run.id}`;
        li.appendChild(link);

        const status = document.createElement('span');
        status.className = 'status';
        status.dataset.status = run.status;
        status.textContent = run.verdict ? `${run.status} — ${run.verdict}` : run.status;
        li.appendChild(status);

        list.appendChild(li);
      }
    }

    document.getElementById('logout-btn').addEventListener('click', logout);

    loadRuns();
  </script>
</body>
</html>
